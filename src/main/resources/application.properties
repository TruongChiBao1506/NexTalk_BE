spring.application.name=NexTalk_BE

# Database Connection
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:nextalk}
spring.mongodb.database=${MONGODB_DATABASE:nextalk}
spring.data.mongodb.uuid-representation=standard
spring.mongodb.uuid-representation=standard
spring.data.mongodb.auto-index-creation=true


# Mail configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT configurations
app.jwt.secret=${JWT_SECRET}
app.token.pepper=${TOKEN_PEPPER:${app.jwt.secret}}
app.jwt.access-expiration-ms=900000
# 15 mins = 15 * 60 * 1000 = 900,000 ms
app.jwt.refresh-expiration-ms=604800000
# 7 days = 7 * 24 * 60 * 60 * 1000 = 604,800,000 ms

# Server configuration
server.port=${PORT:8080}

# CORS - allowed origins (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
app.mobile.reset-return-url=${MOBILE_RESET_RETURN_URL:nextalk://reset-password}
app.auth.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:true}
app.auth.refresh-cookie-same-site=${REFRESH_COOKIE_SAME_SITE:None}
app.auth.refresh-cookie-partitioned=${REFRESH_COOKIE_PARTITIONED:true}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
# Forwarded IP headers are ignored by application rate limits unless the
# deployment explicitly enables this behind a trusted proxy that strips
# client-supplied forwarding headers and blocks direct backend access.
app.security.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:false}
app.security.trusted-proxy-cidrs=${TRUSTED_PROXY_CIDRS:}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.url=${CLOUDINARY_URL:}
app.link-preview.facebook-access-token=${FACEBOOK_OEMBED_ACCESS_TOKEN:}
app.file-security.direct-upload-enabled=${DIRECT_UPLOAD_ENABLED:false}
app.file-security.malware-scanner.enabled=${MALWARE_SCANNER_ENABLED:false}
app.file-security.malware-scanner.host=${MALWARE_SCANNER_HOST:localhost}
app.file-security.malware-scanner.port=${MALWARE_SCANNER_PORT:3310}
app.file-security.malware-scanner.timeout-ms=${MALWARE_SCANNER_TIMEOUT_MS:10000}
app.file-security.allow-basic-unscanned-uploads=${ALLOW_BASIC_UNSCANNED_UPLOADS:false}
app.file-security.private-migration-complete=${MEDIA_PRIVATE_MIGRATION_COMPLETE:false}

# Redis configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:3s}
spring.data.redis.timeout=${REDIS_COMMAND_TIMEOUT:2s}
app.redis.presence-ttl=${REDIS_PRESENCE_TTL:120s}
app.redis.last-seen-ttl=${REDIS_LAST_SEEN_TTL:30d}
app.redis.voice-ttl=${REDIS_VOICE_TTL:120s}

# Bounded application background work and outbound HTTP deadlines
app.async.core-pool-size=${ASYNC_CORE_POOL_SIZE:4}
app.async.max-pool-size=${ASYNC_MAX_POOL_SIZE:8}
app.async.queue-capacity=${ASYNC_QUEUE_CAPACITY:200}
app.async.keep-alive-seconds=${ASYNC_KEEP_ALIVE_SECONDS:60}
app.http-client.connect-timeout=${HTTP_CONNECT_TIMEOUT:3s}
app.http-client.read-timeout=${HTTP_READ_TIMEOUT:15s}

# Durable notification/FCM outbox
app.notification-outbox.worker-enabled=${NOTIFICATION_OUTBOX_WORKER_ENABLED:true}
app.notification-outbox.poll-delay-ms=${NOTIFICATION_OUTBOX_POLL_DELAY_MS:1000}
app.notification-outbox.batch-size=${NOTIFICATION_OUTBOX_BATCH_SIZE:50}
app.notification-outbox.max-attempts=${NOTIFICATION_OUTBOX_MAX_ATTEMPTS:8}
app.notification-outbox.lease-duration=${NOTIFICATION_OUTBOX_LEASE_DURATION:30s}
app.notification-outbox.base-backoff=${NOTIFICATION_OUTBOX_BASE_BACKOFF:2s}
app.notification-outbox.max-backoff=${NOTIFICATION_OUTBOX_MAX_BACKOFF:15m}
app.notification-outbox.jitter-ratio=${NOTIFICATION_OUTBOX_JITTER_RATIO:0.20}
app.message-notification-dispatch.worker-enabled=${MESSAGE_NOTIFICATION_DISPATCH_WORKER_ENABLED:true}
app.message-notification-dispatch.poll-delay-ms=${MESSAGE_NOTIFICATION_DISPATCH_POLL_DELAY_MS:1000}
app.message-notification-dispatch.batch-size=${MESSAGE_NOTIFICATION_DISPATCH_BATCH_SIZE:50}
app.message-notification-dispatch.lease-duration=${MESSAGE_NOTIFICATION_DISPATCH_LEASE_DURATION:30s}
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Legacy data migrations are operational jobs and must never run on normal startup.
app.migrations.legacy-startup-enabled=false
app.migrations.denormalization-startup-enabled=false

# WebSocket/STOMP performance and backpressure
# Native mobile/Expo clients do not consistently send a browser-style Origin.
# STOMP CONNECT remains JWT-authenticated; restrict this in browser-only deployments.
app.websocket.allowed-origin-patterns=${WS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:3001}
app.websocket.inbound-core-pool-size=${WS_INBOUND_CORE_POOL_SIZE:4}
app.websocket.inbound-max-pool-size=${WS_INBOUND_MAX_POOL_SIZE:16}
app.websocket.inbound-queue-capacity=${WS_INBOUND_QUEUE_CAPACITY:1000}
app.websocket.outbound-core-pool-size=${WS_OUTBOUND_CORE_POOL_SIZE:4}
app.websocket.outbound-max-pool-size=${WS_OUTBOUND_MAX_POOL_SIZE:16}
app.websocket.outbound-queue-capacity=${WS_OUTBOUND_QUEUE_CAPACITY:2000}
app.websocket.message-size-limit-bytes=${WS_MESSAGE_SIZE_LIMIT_BYTES:131072}
app.websocket.send-buffer-size-limit-bytes=${WS_SEND_BUFFER_SIZE_LIMIT_BYTES:524288}
app.websocket.send-time-limit-ms=${WS_SEND_TIME_LIMIT_MS:15000}
app.websocket.heartbeat-ms=${WS_HEARTBEAT_MS:10000}
app.websocket.send-rate-limit-per-minute=${WS_SEND_RATE_LIMIT_PER_MINUTE:600}
app.websocket.scheduler-pool-size=${WS_SCHEDULER_POOL_SIZE:4}

# Agora configuration
app.agora.app-id=${AGORA_APP_ID:}
app.agora.app-certificate=${AGORA_APP_CERTIFICATE:}

# Conversation summary via n8n
app.summary.n8n-webhook-url=${N8N_SUMMARY_WEBHOOK_URL:}
app.summary.message-limit=${SUMMARY_MESSAGE_LIMIT:15}
app.summary.preferred-model=${SUMMARY_PREFERRED_MODEL:gemini-3.6-flash}
app.summary.gemini-api-key=${GEMINI_API_KEY:}
app.summary.gemini-model=${SUMMARY_GEMINI_MODEL:gemini-3.6-flash}
app.summary.gemini-url=${SUMMARY_GEMINI_URL:https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={key}}
app.summary.max-output-tokens=${SUMMARY_MAX_OUTPUT_TOKENS:1024}

# Message translation via Cloud Translation Basic v2
app.translation.google-api-key=${GOOGLE_TRANSLATE_API_KEY:}
app.translation.google-url=${GOOGLE_TRANSLATE_URL:https://translation.googleapis.com/language/translate/v2}

# AI assistant mention bot via n8n. This must be a dedicated workflow, not the summary workflow.
app.ai-bot.n8n-webhook-url=${N8N_AI_BOT_WEBHOOK_URL:}
app.ai-bot.message-limit=${AI_BOT_MESSAGE_LIMIT:12}
app.ai-bot.gemini-api-key=${GEMINI_API_KEY:}
app.ai-bot.gemini-model=${AI_BOT_GEMINI_MODEL:gemini-3.6-flash}
app.ai-bot.gemini-url=https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={key}

# AI image editing
app.image-ai.enabled=${IMAGE_AI_ENABLED:true}
app.image-ai.provider=${IMAGE_AI_PROVIDER:cloudinary}
app.image-ai.cloudflare-account-id=${CLOUDFLARE_ACCOUNT_ID:}
app.image-ai.cloudflare-api-token=${CLOUDFLARE_AI_TOKEN:}
app.image-ai.cloudflare-model=${CLOUDFLARE_AI_MODEL:@cf/black-forest-labs/flux-2-klein-4b}
app.image-ai.cloudflare-url=${CLOUDFLARE_AI_URL:https://api.cloudflare.com/client/v4/accounts/{accountId}/ai/run/{model}}
app.image-ai.gemini-api-key=${GEMINI_API_KEY:}
app.image-ai.gemini-model=${IMAGE_AI_GEMINI_MODEL:gemini-2.5-flash-image}
app.image-ai.gemini-url=${IMAGE_AI_GEMINI_URL:https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={key}}
app.ai-bot.max-output-tokens=${AI_BOT_MAX_OUTPUT_TOKENS:2048}

# Antigravity task assistant
app.task-assistant.enabled=${TASK_ASSISTANT_ENABLED:true}
app.task-assistant.api-key=${GEMINI_API_KEY:}
app.task-assistant.agent=${TASK_ASSISTANT_AGENT:antigravity-preview-05-2026}
app.task-assistant.model=${TASK_ASSISTANT_MODEL:gemini-3.6-flash}
app.task-assistant.url=${TASK_ASSISTANT_URL:https://generativelanguage.googleapis.com/v1beta/interactions}
app.task-assistant.max-total-tokens=${TASK_ASSISTANT_MAX_TOTAL_TOKENS:10000}
app.task-assistant.confirmation-minutes=${TASK_ASSISTANT_CONFIRMATION_MINUTES:15}

# AI rate limits (per backend instance)
app.rate-limit.ai-summary.limit=${AI_SUMMARY_RATE_LIMIT:3}
app.rate-limit.ai-summary.window-seconds=${AI_SUMMARY_RATE_WINDOW_SECONDS:300}
app.rate-limit.ai-bot.limit=${AI_BOT_RATE_LIMIT:10}
app.rate-limit.ai-bot.window-seconds=${AI_BOT_RATE_WINDOW_SECONDS:60}
app.rate-limit.image-edit.limit=${IMAGE_EDIT_RATE_LIMIT:10}
app.rate-limit.image-edit.window-seconds=${IMAGE_EDIT_RATE_WINDOW_SECONDS:3600}
app.rate-limit.task-assistant.limit=${TASK_ASSISTANT_RATE_LIMIT:30}
app.rate-limit.task-assistant.window-seconds=${TASK_ASSISTANT_RATE_WINDOW_SECONDS:86400}
app.rate-limit.ai-moderation.limit=${AI_MODERATION_RATE_LIMIT:5}
app.rate-limit.ai-moderation.window-seconds=${AI_MODERATION_RATE_WINDOW_SECONDS:3600}
app.rate-limit.ai-reply.limit=${AI_REPLY_RATE_LIMIT:20}
app.rate-limit.ai-reply.window-seconds=${AI_REPLY_RATE_WINDOW_SECONDS:3600}

# Context-aware reply and birthday wish suggestions
app.ai-reply.gemini-api-key=${GEMINI_API_KEY:}
app.ai-reply.gemini-model=${AI_REPLY_GEMINI_MODEL:gemini-3.6-flash}
app.ai-reply.gemini-url=${AI_REPLY_GEMINI_URL:https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={key}}
app.ai-reply.message-limit=${AI_REPLY_MESSAGE_LIMIT:10}
app.ai-reply.cache-ttl=${AI_REPLY_CACHE_TTL:10m}
app.ai-reply.prompt-version=${AI_REPLY_PROMPT_VERSION:v2-flexible-pronouns}

# Multimodal context shared by Gemini chat features
app.ai-multimodal.max-images=${AI_MULTIMODAL_MAX_IMAGES:3}
app.ai-multimodal.max-image-bytes=${AI_MULTIMODAL_MAX_IMAGE_BYTES:5242880}
app.ai-multimodal.max-total-image-bytes=${AI_MULTIMODAL_MAX_TOTAL_IMAGE_BYTES:10485760}
app.ai-multimodal.allowed-hosts=${AI_MULTIMODAL_ALLOWED_HOSTS:res.cloudinary.com,api.cloudinary.com}

# Multipart file upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# Google OAuth2
google.client.id=${GOOGLE_CLIENT_ID:}
